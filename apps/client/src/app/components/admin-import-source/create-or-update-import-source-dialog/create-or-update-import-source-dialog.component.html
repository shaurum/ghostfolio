<gf-dialog-header
  [title]="getDialogTitle()"
  (closeButtonClicked)="onCancel()"
/>

<div class="flex-grow-1" mat-dialog-content>
  <form
    class="pt-3"
    [formGroup]="importSourceForm"
    (ngSubmit)="onSubmit()"
  >
    <mat-form-field appearance="outline" class="w-100">
      <mat-label i18n>Название</mat-label>
      <input
        formControlName="name"
        matInput
        placeholder="Например: Мой брокер"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label i18n>Тип</mat-label>
      <mat-select formControlName="type">
        <mat-option value="T_INVEST">
          Т Инвестиции
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label i18n>API ключ</mat-label>
      <input
        formControlName="apiKey"
        matInput
        placeholder="Введите API ключ"
        type="password"
      />
    </mat-form-field>

    @if (isLoading) {
      <div class="d-flex justify-content-center mt-3">
        <mat-spinner [diameter]="40" />
      </div>
    }
  </form>
</div>

<div class="d-flex justify-content-end mt-3" mat-dialog-actions>
  <button mat-button (click)="onCancel()" i18n>Отмена</button>
  <button
    class="ml-1"
    color="primary"
    mat-flat-button
    [disabled]="importSourceForm.invalid || isLoading"
    (click)="onSubmit()"
    i18n
  >
    {{ getSubmitButtonText() }}
  </button>
</div>
